name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - personal/ios
    paths:
      - 'MeloX/**'
      - 'MeloXWatchShared/**'
      - 'MeloXLyricsWidget/**'
      - 'MeloXLiveActivityShared/**'
      - 'MeloXLocalization/**'
      - 'MeloX.xcodeproj/**'
      - 'build_ios_unsigned.sh'
      - '.github/workflows/ios-unsigned-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 27.1"
          xcodebuild -list -project MeloX.xcodeproj

      - name: Build unsigned iOS IPA (downloads enabled)
        shell: bash
        env:
          MELOX_BUILD_BUNDLE_VARIANT: legacy
        run: bash ./build_ios_unsigned.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeloX-unsigned-ipa
          path: build/MeloX-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
